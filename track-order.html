<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<title>Order Track করুন — Shoplixo</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --brand:#E41E26;--brand-d:#B8101E;--brand-l:#fff0f0;
  --dark:#0D0D1A;--dark2:#1A1A2E;
  --gold:#FFB800;--green:#00C58A;--green-l:#e6faf4;
  --text:#1A1A2E;--text2:#4A4A6A;--text3:#8B8BAA;
  --bg:#F7F7FC;--bg2:#fff;--border:rgba(0,0,0,.08);
  --r:12px;--r-lg:16px;--r-xl:24px;--r-full:999px;
  --sh:0 4px 20px rgba(0,0,0,.08);--sh-lg:0 8px 40px rgba(0,0,0,.12);
  --t:.22s cubic-bezier(.4,0,.2,1);
}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
a{text-decoration:none;color:inherit}
button{cursor:pointer;border:none;font-family:inherit}
.container{max-width:760px;margin:0 auto;padding:0 20px}

/* ── HEADER ── */
.track-header{background:var(--dark2);padding:18px 0;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.3)}
.hd-inner{display:flex;align-items:center;justify-content:space-between;gap:16px}
.hd-logo{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:#fff}
.hd-logo span{color:var(--gold)}
.hd-back{display:flex;align-items:center;gap:7px;color:rgba(255,255,255,.7);font-size:13px;font-weight:600;transition:var(--t)}
.hd-back:hover{color:#fff}

/* ── HERO ── */
.track-hero{background:linear-gradient(135deg,var(--dark2),#2D1B6E);padding:50px 0 60px;text-align:center}
.th-title{font-family:'Syne',sans-serif;font-size:30px;font-weight:800;color:#fff;margin-bottom:10px}
.th-sub{color:rgba(255,255,255,.6);font-size:15px;margin-bottom:32px}

/* ── SEARCH BOX ── */
.track-box{background:#fff;border-radius:var(--r-xl);padding:28px;box-shadow:var(--sh-lg);max-width:520px;margin:0 auto}
.tb-label{font-size:13px;font-weight:700;color:var(--text2);margin-bottom:8px;letter-spacing:.3px}
.tb-input-row{display:flex;gap:10px}
.tb-input{flex:1;padding:13px 18px;border:2px solid var(--border);border-radius:var(--r-full);font-size:15px;font-family:inherit;outline:none;transition:var(--t)}
.tb-input:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(228,30,38,.08)}
.tb-input::placeholder{color:var(--text3)}
.tb-btn{background:var(--brand);color:#fff;padding:13px 22px;border-radius:var(--r-full);font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px;transition:var(--t);flex-shrink:0}
.tb-btn:hover{background:var(--brand-d);transform:translateY(-1px)}
.tb-btn:active{transform:scale(.97)}
.tb-hint{font-size:12px;color:var(--text3);margin-top:10px;text-align:center}
.tb-hint span{color:var(--brand);font-weight:600;cursor:pointer}

/* ── CONTENT AREA ── */
.track-content{padding:40px 0 80px}
#track-result{display:none}
#track-error{display:none}
#track-loading{display:none;text-align:center;padding:60px 0}
.loading-spin{width:48px;height:48px;border:4px solid var(--border);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── ORDER CARD ── */
.order-card{background:#fff;border-radius:var(--r-xl);overflow:hidden;box-shadow:var(--sh);margin-bottom:20px}
.oc-head{padding:22px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.oc-id{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;color:var(--brand)}
.oc-date{font-size:12px;color:var(--text3)}
.status-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:var(--r-full);font-size:12px;font-weight:700}
.sp-pending{background:#fff8e6;color:#b35900}
.sp-confirmed{background:#e6f0ff;color:#1a5ca8}
.sp-processing{background:#f3f0ff;color:#6d28d9}
.sp-shipped{background:#e6faf4;color:#065f46}
.sp-delivered{background:#e6faf4;color:var(--green)}
.sp-cancelled{background:var(--brand-l);color:var(--brand)}

/* ── TIMELINE ── */
.oc-timeline{padding:28px 24px}
.tl-title{font-size:13px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:20px}
.timeline{position:relative;padding-left:28px}
.timeline::before{content:'';position:absolute;left:9px;top:8px;bottom:8px;width:2px;background:var(--border)}
.tl-item{position:relative;margin-bottom:22px}
.tl-item:last-child{margin-bottom:0}
.tl-dot{position:absolute;left:-28px;top:4px;width:20px;height:20px;border-radius:50%;border:3px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;font-size:8px;z-index:1;transition:var(--t)}
.tl-item.done .tl-dot{background:var(--green);border-color:var(--green);color:#fff;font-size:9px}
.tl-item.active .tl-dot{background:var(--brand);border-color:var(--brand);color:#fff;animation:pulseDot 2s infinite}
@keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 rgba(228,30,38,.4)}50%{box-shadow:0 0 0 6px rgba(228,30,38,0)}}
.tl-label{font-size:14px;font-weight:600;color:var(--text2)}
.tl-item.done .tl-label{color:var(--green)}
.tl-item.active .tl-label{color:var(--brand)}
.tl-note{font-size:12px;color:var(--text3);margin-top:2px}
.tl-time{font-size:11px;color:var(--text3);margin-top:2px}

/* ── ORDER DETAILS ── */
.oc-details{padding:0 24px 24px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.od-group{background:var(--bg);border-radius:var(--r);padding:14px 16px}
.od-lbl{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
.od-val{font-size:14px;font-weight:600;color:var(--text)}
.od-sub{font-size:12px;color:var(--text3);margin-top:2px}

/* ── ITEMS ── */
.oc-items{padding:0 24px 24px}
.oci-title{font-size:13px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:12px}
.order-item{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--border)}
.order-item:last-child{border-bottom:none}
.oi-img{width:56px;height:68px;border-radius:var(--r);overflow:hidden;background:var(--bg);flex-shrink:0}
.oi-img img{width:100%;height:100%;object-fit:cover}
.oi-info{flex:1}
.oi-name{font-size:13px;font-weight:600;margin-bottom:3px}
.oi-meta{font-size:12px;color:var(--text3)}
.oi-price{font-size:14px;font-weight:700;color:var(--brand)}

/* ── PRICING ── */
.oc-pricing{padding:0 24px 24px}
.price-row{display:flex;justify-content:space-between;font-size:13px;color:var(--text2);margin-bottom:8px}
.price-total{display:flex;justify-content:space-between;font-size:17px;font-weight:700;color:var(--dark);border-top:2px solid var(--border);padding-top:12px;margin-top:4px}
.price-total span:last-child{color:var(--brand)}

/* ── TRACKING INFO ── */
.courier-card{background:linear-gradient(135deg,var(--dark2),#2D1B6E);border-radius:var(--r-lg);padding:18px 20px;color:#fff;margin:0 24px 24px;display:flex;align-items:center;gap:14px}
.cc-icon{width:44px;height:44px;background:rgba(255,255,255,.1);border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.cc-label{font-size:12px;color:rgba(255,255,255,.6);margin-bottom:4px}
.cc-val{font-size:15px;font-weight:700}

/* ── ACTIONS ── */
.oc-actions{padding:0 24px 24px;display:flex;gap:10px;flex-wrap:wrap}
.btn-action{display:flex;align-items:center;gap:7px;padding:11px 18px;border-radius:var(--r-full);font-size:13px;font-weight:700;transition:var(--t)}
.btn-action-wa{background:#25D366;color:#fff}
.btn-action-wa:hover{background:#1fad55}
.btn-action-shop{background:var(--brand);color:#fff}
.btn-action-shop:hover{background:var(--brand-d)}

/* ── ERROR STATE ── */
.error-card{background:#fff;border-radius:var(--r-xl);padding:50px 30px;text-align:center;box-shadow:var(--sh)}
.error-card i{font-size:48px;color:var(--brand);margin-bottom:16px;display:block;opacity:.5}
.error-card h3{font-size:20px;font-weight:700;margin-bottom:8px;color:var(--dark)}
.error-card p{color:var(--text2);font-size:14px;line-height:1.6}

/* ── RESPONSIVE ── */
@media(max-width:600px){
  .th-title{font-size:24px}
  .tb-input-row{flex-direction:column}
  .tb-btn{justify-content:center}
  .oc-details{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="track-header">
  <div class="container">
    <div class="hd-inner">
      <a href="/" class="hd-logo">Shop<span>lixo</span></a>
      <a href="/" class="hd-back"><i class="fa-solid fa-chevron-left"></i> হোমে ফিরুন</a>
    </div>
  </div>
</header>

<!-- HERO + SEARCH -->
<div class="track-hero">
  <div class="container">
    <h1 class="th-title"><i class="fa-solid fa-box-open" style="color:var(--gold)"></i> Order Track করুন</h1>
    <p class="th-sub">আপনার Order ID দিয়ে অর্ডারের বর্তমান অবস্থা জানুন</p>

    <div class="track-box">
      <div class="tb-label">Order ID লিখুন (যেমন: SL-ABC123)</div>
      <div class="tb-input-row">
        <input id="track-input" class="tb-input" type="text" placeholder="SL-XXXXXX"
          maxlength="20" style="text-transform:uppercase"
          onkeypress="if(event.key==='Enter')trackOrder()">
        <button class="tb-btn" onclick="trackOrder()">
          <i class="fa-solid fa-magnifying-glass"></i> Track
        </button>
      </div>
      <div class="tb-hint">
        Order ID পাননি?
        <span onclick="window.open('https://wa.me/8801516511889?text=আমার Order ID জানতে চাই','_blank')">
          WhatsApp করুন
        </span>
      </div>
    </div>
  </div>
</div>

<!-- RESULT AREA -->
<div class="track-content">
  <div class="container">

    <!-- Loading -->
    <div id="track-loading">
      <div class="loading-spin"></div>
      <p style="color:var(--text3);font-size:14px">Order খোঁজা হচ্ছে...</p>
    </div>

    <!-- Error -->
    <div id="track-error">
      <div class="error-card">
        <i class="fa-solid fa-circle-exclamation"></i>
        <h3 id="error-title">Order পাওয়া যায়নি</h3>
        <p id="error-msg">এই Order ID দিয়ে কোনো অর্ডার পাওয়া যায়নি। সঠিক Order ID দিন।</p>
        <div style="margin-top:20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
          <a href="https://wa.me/8801516511889" target="_blank" class="btn-action btn-action-wa">
            <i class="fa-brands fa-whatsapp"></i> WhatsApp Support
          </a>
          <a href="/" class="btn-action btn-action-shop">
            <i class="fa-solid fa-house"></i> হোমে যান
          </a>
        </div>
      </div>
    </div>

    <!-- Result -->
    <div id="track-result"></div>

  </div>
</div>

<script>
const API_BASE = window.location.origin;
const WA_NUM   = '8801516511889';

const STATUS_CONFIG = {
  pending:    { label:'অর্ডার গৃহীত',     icon:'fa-clock',        pill:'sp-pending',    step:1 },
  confirmed:  { label:'অর্ডার কনফার্ম',  icon:'fa-check-circle', pill:'sp-confirmed',  step:2 },
  processing: { label:'প্রস্তুত হচ্ছে',  icon:'fa-gears',        pill:'sp-processing', step:3 },
  shipped:    { label:'পাঠানো হয়েছে',    icon:'fa-truck',        pill:'sp-shipped',    step:4 },
  delivered:  { label:'ডেলিভারি সম্পন্ন',icon:'fa-party-horn',   pill:'sp-delivered',  step:5 },
  cancelled:  { label:'বাতিল',            icon:'fa-ban',          pill:'sp-cancelled',  step:0 },
  refunded:   { label:'Refund হয়েছে',    icon:'fa-rotate-left',  pill:'sp-cancelled',  step:0 },
};

const TIMELINE_STEPS = [
  { key:'pending',    label:'অর্ডার গৃহীত',    icon:'fa-clipboard-check', note:'অর্ডার সফলভাবে রেজিস্ট্রেশন হয়েছে' },
  { key:'confirmed',  label:'অর্ডার কনফার্ম',  icon:'fa-circle-check',    note:'আমাদের টিম অর্ডারটি যাচাই করেছে' },
  { key:'processing', label:'প্যাকেজিং',       icon:'fa-box',             note:'আপনার পণ্য প্যাক করা হচ্ছে' },
  { key:'shipped',    label:'শিপমেন্ট',        icon:'fa-truck-fast',      note:'কুরিয়ারে দেওয়া হয়েছে' },
  { key:'delivered',  label:'ডেলিভারি সম্পন্ন',icon:'fa-house-circle-check',note:'পণ্য আপনার কাছে পৌঁছেছে' },
];

async function trackOrder() {
  const input = document.getElementById('track-input');
  const id    = input.value.trim().toUpperCase();

  if (!id || id.length < 5) {
    input.style.borderColor = 'var(--brand)';
    input.focus();
    input.placeholder = 'Order ID দিন! (যেমন: SL-ABC123)';
    setTimeout(() => { input.style.borderColor = ''; input.placeholder = 'SL-XXXXXX'; }, 2000);
    return;
  }

  show('track-loading');
  hide('track-result');
  hide('track-error');

  try {
    const res  = await fetch(`${API_BASE}/api/orders?id=${encodeURIComponent(id)}`);
    const data = await res.json();
    hide('track-loading');

    if (!data.ok || !data.order) {
      document.getElementById('error-title').textContent = 'Order পাওয়া যায়নি';
      document.getElementById('error-msg').textContent =
        `"${id}" — এই Order ID দিয়ে কোনো অর্ডার পাওয়া যায়নি। সঠিক Order ID দিন বা WhatsApp করুন।`;
      show('track-error');
      return;
    }

    renderResult(data.order);
    show('track-result');

  } catch (err) {
    hide('track-loading');
    document.getElementById('error-title').textContent = 'Connection Error';
    document.getElementById('error-msg').textContent   = 'Internet connection check করুন এবং আবার চেষ্টা করুন।';
    show('track-error');
  }
}

function renderResult(o) {
  const cfg     = STATUS_CONFIG[o.status] || STATUS_CONFIG.pending;
  const items   = o.items || [];
  const pricing = o.pricing || {};
  const history = o.history || [];

  /* Build timeline */
  const currentStep = cfg.step;
  const isCancelled = o.status === 'cancelled' || o.status === 'refunded';

  const tlHTML = isCancelled
    ? `<div class="tl-item active">
        <div class="tl-dot"><i class="fa-solid fa-ban" style="font-size:8px"></i></div>
        <div class="tl-label" style="color:var(--brand)">অর্ডার বাতিল হয়েছে</div>
        <div class="tl-note">যোগাযোগের জন্য WhatsApp করুন</div>
      </div>`
    : TIMELINE_STEPS.map(step => {
        const stepNum = STATUS_CONFIG[step.key]?.step || 0;
        const done    = stepNum < currentStep;
        const active  = stepNum === currentStep;
        const cls     = done ? 'done' : (active ? 'active' : '');

        // Get history note for this step
        const histNote = history.find(h => h.status === step.key);
        const timeStr  = histNote?.updatedAt
          ? new Date(histNote.updatedAt).toLocaleString('bn-BD', {dateStyle:'medium',timeStyle:'short'})
          : '';

        return `<div class="tl-item ${cls}">
          <div class="tl-dot"><i class="fa-solid ${done || active ? step.icon : 'fa-circle'}" style="font-size:${done||active?'8':'6'}px"></i></div>
          <div class="tl-label">${step.label}</div>
          <div class="tl-note">${step.note}</div>
          ${timeStr ? `<div class="tl-time"><i class="fa-regular fa-clock"></i> ${timeStr}</div>` : ''}
        </div>`;
      }).join('');

  /* Build items */
  const itemsHTML = items.map(i => `
    <div class="order-item">
      <div class="oi-img">
        ${i.img ? `<img src="${esc(i.img)}" alt="${esc(i.name)}" loading="lazy">` : `<div style="width:100%;height:100%;background:var(--bg2);display:flex;align-items:center;justify-content:center"><i class="fa-solid fa-image" style="color:var(--border)"></i></div>`}
      </div>
      <div class="oi-info">
        <div class="oi-name">${esc(i.name)}</div>
        <div class="oi-meta">
          ${i.size ? `Size: ${esc(i.size)}` : ''}
          ${i.color ? ` · Color: ${esc(i.color)}` : ''}
          · Qty: ${i.qty}
        </div>
      </div>
      <div class="oi-price">৳${fmt(i.price * i.qty)}</div>
    </div>`).join('');

  /* Build courier section */
  const courierHTML = o.tracking?.courier ? `
    <div class="courier-card">
      <div class="cc-icon"><i class="fa-solid fa-truck-fast"></i></div>
      <div>
        <div class="cc-label">কুরিয়ার সার্ভিস</div>
        <div class="cc-val">${esc(o.tracking.courier)}</div>
        ${o.tracking.trackingId ? `<div style="font-size:12px;color:rgba(255,255,255,.6);margin-top:2px">Tracking ID: ${esc(o.tracking.trackingId)}</div>` : ''}
      </div>
    </div>` : '';

  const waMsg = `আমার Order Track করতে চাই। Order ID: ${o.orderId}`;

  document.getElementById('track-result').innerHTML = `
    <!-- Order Card -->
    <div class="order-card" style="animation:fadeUp .4s ease">

      <!-- Header -->
      <div class="oc-head">
        <div>
          <div class="oc-id">${esc(o.orderId)}</div>
          <div class="oc-date">${o.createdAt ? new Date(o.createdAt).toLocaleString('bn-BD',{dateStyle:'long',timeStyle:'short'}) : ''}</div>
        </div>
        <div class="status-pill ${cfg.pill}">
          <i class="fa-solid ${cfg.icon}"></i>
          ${cfg.label}
        </div>
      </div>

      <!-- Timeline -->
      <div class="oc-timeline">
        <div class="tl-title"><i class="fa-solid fa-route"></i> Delivery Status</div>
        <div class="timeline">${tlHTML}</div>
      </div>

      ${courierHTML}

      <!-- Customer Details -->
      <div class="oc-details">
        <div class="od-group">
          <div class="od-lbl">Customer</div>
          <div class="od-val">${esc(o.customer?.name || '')}</div>
          <div class="od-sub">${esc(o.customer?.phone || '')}</div>
        </div>
        <div class="od-group">
          <div class="od-lbl">Payment</div>
          <div class="od-val" style="text-transform:uppercase">${esc(o.payment?.method || 'COD')}</div>
        </div>
      </div>

      <!-- Items -->
      <div class="oc-items">
        <div class="oci-title"><i class="fa-solid fa-box"></i> অর্ডার করা পণ্য</div>
        ${itemsHTML}
      </div>

      <!-- Pricing -->
      <div class="oc-pricing">
        <div class="price-row"><span>Subtotal</span><span>৳${fmt(pricing.subtotal||0)}</span></div>
        <div class="price-row">
          <span>Shipping</span>
          <span style="color:var(--green)">${pricing.shipping===0?'বিনামূল্যে 🎉':'৳'+fmt(pricing.shipping||60)}</span>
        </div>
        ${pricing.discount > 0 ? `<div class="price-row" style="color:var(--green)"><span>Discount</span><span>-৳${fmt(pricing.discount)}</span></div>` : ''}
        <div class="price-total"><span>মোট</span><span>৳${fmt(pricing.total||0)}</span></div>
      </div>

      <!-- Actions -->
      <div class="oc-actions">
        <a href="https://wa.me/${WA_NUM}?text=${encodeURIComponent(waMsg)}" target="_blank" class="btn-action btn-action-wa">
          <i class="fa-brands fa-whatsapp"></i> WhatsApp Support
        </a>
        <a href="/" class="btn-action btn-action-shop">
          <i class="fa-solid fa-bag-shopping"></i> Shopping চালিয়ে যান
        </a>
      </div>

    </div>`;
}

function show(id) { const el = document.getElementById(id); if(el) el.style.display = 'block'; }
function hide(id) { const el = document.getElementById(id); if(el) el.style.display = 'none'; }
function fmt(n) { return Number(n).toLocaleString('en-BD'); }
function esc(s) { return String(s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

/* Auto-track if URL has ?id= */
const urlId = new URLSearchParams(location.search).get('id');
if (urlId) {
  document.getElementById('track-input').value = urlId.toUpperCase();
  trackOrder();
}

/* CSS animation */
const s = document.createElement('style');
s.textContent = '@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}';
document.head.appendChild(s);
</script>
</body>
